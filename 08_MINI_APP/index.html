<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a85d27"><title>SAHARA GOLD MINING</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff5d9;font-family:Arial,sans-serif;background:linear-gradient(180deg,#69b9eb 0%,#ffd28a 43%,#e99343 65%,#9b4b20 100%);overflow-x:hidden}
.sun{position:fixed;z-index:-2;top:26%;left:12%;width:150px;height:150px;border-radius:50%;background:#fff0a6;box-shadow:0 0 55px 25px #ffd16b}
.dune{position:fixed;z-index:-1;left:-10%;right:-10%;bottom:18%;height:34%;background:#e8a04c;border-radius:50% 50% 0 0/25% 25% 0 0;transform:rotate(-5deg)}
.dune2{bottom:-5%;height:34%;background:#c96d2d;transform:rotate(6deg)}.dune3{bottom:-13%;height:25%;background:#93451f;transform:rotate(-2deg)}
.camel{position:fixed;z-index:-1;right:5%;bottom:14%;font-size:clamp(75px,20vw,115px);filter:drop-shadow(0 5px 4px #75401d)}
.palm{position:fixed;z-index:-1;left:4%;bottom:26%;font-size:62px}
.wrap{width:min(100%,480px);margin:auto;padding:18px 16px 30px}.top{display:flex;justify-content:space-between;gap:10px}
.pill{background:linear-gradient(#8d4a1b,#4e260f);border:2px solid #ffda70;border-radius:15px;padding:10px;box-shadow:0 4px 0 #51250e;min-width:0}.pill small{display:block;color:#ffe6a3;font-size:12px;margin-bottom:4px}.pill strong{font-size:15px;overflow-wrap:anywhere}
header{text-align:center;margin:28px 0 22px}.logo{display:inline-block;padding:14px 20px;background:linear-gradient(135deg,#5b2a10,#a85a20,#51230d);border:3px solid #ffdb70;border-radius:24px;box-shadow:0 7px 0 #57260e}
h1{margin:0;color:#ffd34d;font-size:clamp(28px,8vw,42px);line-height:1.05;text-shadow:2px 3px 0 #4b210b}header p{font-weight:bold;text-shadow:1px 2px 3px #54260d}
.menu{display:grid;gap:12px;max-width:370px;margin:20px auto}button{width:100%;min-height:58px;border:2px solid #ffda75;border-radius:16px;background:linear-gradient(#a85d27,#63300f);color:#fff5d5;font-size:18px;font-weight:bold;box-shadow:0 5px 0 #4b210d;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 2px 0 #4b210d}button span{margin-left:9px;font-size:22px}
.note{background:#54270fe8;border:1px solid #ffd46d;border-radius:14px;padding:12px;font-size:12px;line-height:1.8;text-align:center;margin-top:22px}footer{text-align:center;font-size:12px;margin-top:18px;text-shadow:1px 1px 2px #54270f}
</style></head><body><div class="sun"></div><div class="dune"></div><div class="dune dune2"></div><div class="dune dune3"></div><div class="palm">🌴</div><div class="camel">🐪</div>

<header><div class="logo"><h1>SAHARA<br>GOLD MINING</h1></div><p>⛏️ استكشف الصحراء واجمع الذهب ⛏️</p></header>
<div class="menu"><button id="mine"><span>⛏️</span> بدء التعدين</button><button id="ad"><span>🎁</span> شاهد إعلاناً واربح</button><button id="progress"><span>🏆</span> تقدمي ومستواي</button><button id="settings"><span>⚙️</span> الإعدادات</button><button id="about"><span>ℹ️</span> حول اللعبة</button></div>
<div class="note">نسخة تجريبية من الواجهة الصحراوية. الرصيد والتعدين والإعلانات غير مفعّلة بعد؛ سيتم تشغيلها بعد ربط الخادم والتحقق الآمن من الحساب.</div><footer>SAHARA GOLD MINING · DRJ</footer></div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();const u=tg.initDataUnsafe?.user;if(u)document.getElementById('player').textContent='ID: '+u.id;}
const tell=m=>tg?tg.showAlert(m):alert(m);
document.getElementById('mine').onclick=()=>tell('التعدين غير مفعّل بعد.');document.getElementById('ad').onclick=()=>tell('الإعلانات والمكافآت قيد الربط.');document.getElementById('progress').onclick=()=>tell('سيظهر تقدمك بعد ربط قاعدة البيانات.');document.getElementById('settings').onclick=()=>tell('الإعدادات ستتوفر لاحقاً.');document.getElementById('about').onclick=()=>tell('SAHARA GOLD MINING — لعبة تجريبية بعملة DRJ.');
</script></body></html>
